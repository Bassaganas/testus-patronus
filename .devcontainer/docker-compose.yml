version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: development
    volumes:
      - ..:/workspaces:cached
      - ~/.gitconfig:/home/vscode/.gitconfig
    command: sleep infinity
    ports:
      - "8000:8000"
      - "3000:3000"
    user: vscode
    environment:
      - PYTHONPATH=/workspaces/testus-patronus/backend

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ALLOW_RESET=true
      - ANONYMIZED_TELEMETRY=false

volumes:
  chroma_data:
